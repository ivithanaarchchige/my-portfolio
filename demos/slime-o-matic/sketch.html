<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slime-O-Matic play area</title>
  <style>
    body { margin: 0; overflow: hidden; color: white; background: #141414; font: 16px system-ui, sans-serif; }
    canvas { display: block; }
    button { cursor: pointer; font: inherit; }
    :focus-visible { outline: 3px solid #eac64f; outline-offset: 3px; }
    .art-control { border: 0; background: transparent; }
    .art-control[aria-pressed="true"] { outline: 3px solid #ffdb60; outline-offset: 3px; }
    .mix-status { margin: 0; width: 300px; }
  </style>
  <script src="../shared/p5.js"></script>
  <script src="js/slime-sprite.js"></script>
  <script src="js/sketch.js"></script>
</head>
<body></body>
</html>
